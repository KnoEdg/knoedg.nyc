name: TEMP Promote 30-enclaves provenance conformance

on:
  push:
    branches:
      - codex/public-data-provenance
    paths:
      - ".github/workflows/tmp-stage-30-enclaves-technical-collection.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-data-provenance
      - name: Patch the standing validation workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-nyc-boundary-counts.yml')
          text = path.read_text(encoding='utf-8')

          old_article = '      - "nyc-immigrant-enclaves/**"\n'
          if text.count(old_article) != 2:
              raise SystemExit(f'expected two stale article path filters, found {text.count(old_article)}')
          text = text.replace(old_article, '      - "inside-the-map-of-30-immigrant-enclaves/**"\n')

          paper_path = '      - "nyc-immigrant-enclaves-paper/**"\n'
          if text.count(paper_path) != 2:
              raise SystemExit(f'expected two legacy paper path filters, found {text.count(paper_path)}')
          text = text.replace(
              paper_path,
              paper_path + '      - "data/30-immigrant-enclaves-map/**"\n',
          )

          paper_fixture = '      - "data/fixtures/nyc-immigrant-enclaves-data-paper.json"\n'
          if text.count(paper_fixture) != 2:
              raise SystemExit(f'expected two paper fixture filters, found {text.count(paper_fixture)}')
          text = text.replace(
              paper_fixture,
              paper_fixture + '      - "data/fixtures/30-immigrant-enclaves-map-technical-collection.json"\n',
          )

          paper_check = '      - run: python3 scripts/generate_nyc_immigrant_enclaves_paper.py --check\n'
          if text.count(paper_check) != 1:
              raise SystemExit('could not identify the standing paper regeneration check')
          text = text.replace(
              paper_check,
              paper_check
              + '      - run: python3 scripts/generate_30_enclaves_map_data.py --check\n'
              + '      - run: python3 scripts/validate_public_provenance.py\n',
          )

          schema_tuple = '              ("schemas/data-paper/v1", "data/fixtures/nyc-immigrant-enclaves-data-paper.json"),\n'
          if text.count(schema_tuple) != 1:
              raise SystemExit('could not identify enclave schema-validation vector')
          text = text.replace(
              schema_tuple,
              schema_tuple
              + '              ("schemas/fixture-dependent-public-view/v2", "data/fixtures/30-immigrant-enclaves-map-technical-collection.json"),\n',
          )

          overture_ld = '      - name: Validate NYC Overture source-page JSON-LD expansion\n'
          if text.count(overture_ld) != 1:
              raise SystemExit('could not identify JSON-LD validation insertion point')
          technical_ld = '''      - name: Validate 30 Immigrant Enclaves Map technical-collection JSON-LD expansion
        run: |
          python3 - <<'PYLD'
          import json
          from pyld import jsonld
          document = json.load(open("data/30-immigrant-enclaves-map/index.jsonld"))
          expanded = jsonld.expand(document)
          if not isinstance(expanded, list) or not expanded:
              raise SystemExit("30-enclaves technical JSON-LD expansion produced no nodes")
          for node in expanded:
              identifier = node.get("@id")
              if identifier is not None and not identifier.startswith("https://"):
                  raise SystemExit(f"expanded graph contains a non-HTTPS node identity: {identifier}")
          print(f"30-enclaves technical JSON-LD expansion validates: {len(expanded)} nodes.")
          PYLD
'''
          text = text.replace(overture_ld, technical_ld + overture_ld)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Assert the stale path and unresolved namespace are absent
        run: |
          ! grep -Fq '"nyc-immigrant-enclaves/**"' .github/workflows/validate-nyc-boundary-counts.yml
          grep -Fq '"inside-the-map-of-30-immigrant-enclaves/**"' .github/workflows/validate-nyc-boundary-counts.yml
          grep -Fq '"data/30-immigrant-enclaves-map/**"' .github/workflows/validate-nyc-boundary-counts.yml
          grep -Fq 'scripts/validate_public_provenance.py' .github/workflows/validate-nyc-boundary-counts.yml
      - name: Commit permanent conformance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-nyc-boundary-counts.yml
          if git diff --cached --quiet; then
            echo "standing workflow already promoted"
          else
            git commit -m "ci: enforce dereferenceable public provenance"
            git push origin HEAD:codex/public-data-provenance
          fi
