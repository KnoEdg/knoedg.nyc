name: TEMP Stage 30-enclaves technical collection

on:
  push:
    branches:
      - codex/public-data-provenance
    paths:
      - ".github/workflows/tmp-stage-30-enclaves-technical-collection.yml"
  pull_request:
    paths:
      - ".github/workflows/tmp-stage-30-enclaves-technical-collection.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-data-provenance
      - name: Generate technical collection surfaces
        run: python3 scripts/generate_30_enclaves_map_data.py
      - name: Verify deterministic regeneration
        run: python3 scripts/generate_30_enclaves_map_data.py --check
      - name: Reject unresolved/private public provenance
        run: |
          ! grep -REiq 'knoedg.org/nyc-knowledge-pack/assertion-metadata-|github.com/knoedg/(pack-nyc|meta-knoedg-nyc)|knoedg/(pack-nyc|meta-knoedg-nyc)' data/30-immigrant-enclaves-map data/fixtures/30-immigrant-enclaves-map-technical-collection.json
      - name: Commit exact generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/30-immigrant-enclaves-map
          if git diff --cached --quiet; then
            echo "generated outputs already staged"
          else
            git commit -m "feat: generate 30-enclaves public technical surfaces"
            git push origin HEAD:codex/public-data-provenance
          fi
