name: Materialize Enclaves paper route migration

on:
  pull_request:
    paths:
      - "data/fixtures/nyc-immigrant-enclaves-data-paper.json"
      - "scripts/generate_nyc_immigrant_enclaves_paper.py"
      - "scripts/materialize_enclaves_paper_route_migration.py"
      - "scripts/validate_enclaves_paper_route.py"
      - ".github/workflows/materialize-enclaves-paper-route-migration.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize approved identity and legacy redirect
        run: python3 scripts/materialize_enclaves_paper_route_migration.py
      - name: Render canonical paper from public-safe artifact
        run: python3 scripts/generate_nyc_immigrant_enclaves_paper.py
      - name: Reconcile publication checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          sums = root / 'data/fixtures/SHA256SUMS'
          rows = []
          by_path = {}
          for raw in sums.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              digest, path = raw.split('  ', 1)
              by_path[path] = digest
              rows.append(path)

          remove = {'nyc-immigrant-enclaves-paper/index.jsonld'}
          touched = [
              'data/fixtures/nyc-immigrant-enclaves-data-paper.json',
              'scripts/generate_nyc_immigrant_enclaves_paper.py',
              'nyc-immigrant-enclaves-paper/index.html',
              'data/papers/the-map-of-30-immigrant-enclaves-provenance-evidence-and-limits/index.html',
              'data/papers/the-map-of-30-immigrant-enclaves-provenance-evidence-and-limits/index.jsonld',
          ]
          for path in remove:
              by_path.pop(path, None)
              rows = [p for p in rows if p != path]
          for path in touched:
              payload = (root / path).read_bytes()
              by_path[path] = hashlib.sha256(payload).hexdigest()
              if path not in rows:
                  rows.append(path)
          sums.write_text(''.join(f'{by_path[p]}  {p}\n' for p in rows), encoding='utf-8')
          PY
      - name: Validate migration surfaces
        run: python3 scripts/validate_enclaves_paper_route.py
      - name: Commit generated publication state when needed
        run: |
          if git diff --quiet; then
            echo "publication already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Enclaves paper title-derived route"
          git push origin HEAD:${{ github.head_ref }}
