name: Publish data paper title v14
on:
  push:
    branches:
      - publish/data-paper-title-v14
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply governed v14 title revision and verify source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/fixtures/nyc-immigrant-enclaves-data-paper.json')
          s = p.read_text()
          pairs = [
              ('"artifactVersion": "2026-08-21.13"', '"artifactVersion": "2026-08-21.14"'),
              ('"issuedAt": "2026-08-21T20:19:16Z"', '"issuedAt": "2026-08-21T21:50:32Z"'),
              ('"title": "The NYC Immigrant Enclaves map — provenance, evidence and limits"', '"title": "The Map of 30 Immigrant Enclaves — provenance, evidence and limits"'),
              ('"text": "The NYC Immigrant Enclaves map"', '"text": "The Map of 30 Immigrant Enclaves"'),
              ('"schema:name": "The NYC Immigrant Enclaves map — provenance, evidence and limits"', '"schema:name": "The Map of 30 Immigrant Enclaves — provenance, evidence and limits"'),
          ]
          for old, new in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {n}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          test "$(git hash-object data/fixtures/nyc-immigrant-enclaves-data-paper.json)" = "c1156038e915f7f917b23ba939fb3bc5e3304431"
      - name: Render paper and refresh checksum ledger
        run: |
          python3 scripts/generate_nyc_immigrant_enclaves_paper.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          ledger = Path('data/fixtures/SHA256SUMS')
          lines = ledger.read_text().splitlines()
          targets = [
              'data/fixtures/nyc-immigrant-enclaves-data-paper.json',
              'nyc-immigrant-enclaves-paper/index.html',
              'nyc-immigrant-enclaves-paper/index.jsonld',
          ]
          by_path = {line.split('  ',1)[1]: line for line in lines if '  ' in line}
          for path in targets:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              by_path[path] = f'{digest}  {path}'
          out=[]
          seen=set()
          for line in lines:
              if '  ' not in line:
                  out.append(line); continue
              path=line.split('  ',1)[1]
              if path in targets:
                  out.append(by_path[path]); seen.add(path)
              else:
                  out.append(line)
          for path in targets:
              if path not in seen:
                  out.append(by_path[path])
          ledger.write_text('\n'.join(out)+'\n')
          PY
      - name: Remove temporary workflow and commit clean publication
        run: |
          rm .github/workflows/publish-data-paper-title-v14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/fixtures/nyc-immigrant-enclaves-data-paper.json data/fixtures/SHA256SUMS nyc-immigrant-enclaves-paper/index.html nyc-immigrant-enclaves-paper/index.jsonld .github/workflows/publish-data-paper-title-v14.yml
          git commit -m "publish: retitle immigrant enclaves data paper"
          git push
