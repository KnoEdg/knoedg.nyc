      - "data/fixtures/nyc-dcp-borough-boundaries-public-view.json"
      - "scripts/generate_nyc_dcp_source_view.py"
      - "data/fixtures/nyc-census-gazetteer-source-public-view.json"
      - "scripts/generate_nyc_census_gazetteer_source_view.py"
      - "data/fixtures/nyc-openstreetmap-source-public-view.json"
      - "scripts/generate_nyc_openstreetmap_source_view.py"
      - "data/fixtures/nyc-whos-on-first-source-public-view.json"
      - "scripts/generate_nyc_whos_on_first_source_view.py"
      - "data/fixtures/nyc-geoboundaries-source-public-view.json"
      - "scripts/generate_nyc_geoboundaries_source_view.py"
      - "data/fixtures/nyc-overture-source-public-view.json"
