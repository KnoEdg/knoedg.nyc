          artifact = json.load(open("data/fixtures/nyc-whos-on-first-source-public-view.json"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(artifact)
          PY
      - run: python3 scripts/generate_nyc_whos_on_first_source_view.py --check
      - name: Validate NYC Who's On First source-page JSON-LD expansion
        run: |
          python3 - <<'PY'
          import json
