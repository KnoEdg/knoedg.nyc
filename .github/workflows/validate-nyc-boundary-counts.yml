      - "data/fixtures/SHA256SUMS"
      - "schemas/fixture-dependent-public-view/**"
      - "schemas/nyc-census-gazetteer-counties/**"
      - "schemas/nyc-openstreetmap-relation-metadata/**"
      - "schemas/nyc-geoboundaries-usa-adm2-counties/**"
      - "schemas/nyc-whos-on-first-county-representations/**"
      - "schemas/nyc-overture-division-area-representations/**"
      - "scripts/validate_nyc_census_gazetteer_fixture.py"
      - "scripts/validate_nyc_osm_relation_metadata_fixture.py"
      - "scripts/validate_nyc_geoboundaries_fixture.py"
      - "scripts/validate_nyc_whos_on_first_fixture.py"
      - "scripts/validate_nyc_overture_fixture.py"
      - "templates/fixture-page.html"
      - ".github/workflows/validate-nyc-boundary-counts.yml"

permissions:
  contents: read

jobs:
  validate-fixture-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned conformance dependencies
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.0 PyLD==2.0.4
      - name: Validate v2 artifact against the public JSON Schema
        run: |
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open("schemas/fixture-dependent-public-view/v2"))
          artifact = json.load(open("data/fixtures/nyc-boundary-public-view.json"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(artifact)
          PY
      - run: python3 scripts/build_nyc_water_included_fixture.py --check
      - run: python3 scripts/generate_nyc_boroughs_svg.py --check
      - run: python3 scripts/generate_nyc_boundaries_view.py --check
      - run: python3 scripts/test_fixture_page_renderer.py
      - run: python3 scripts/validate_nyc_boundary_counts.py
      - run: python3 scripts/validate_jsonld.py
      - run: python3 scripts/validate_nyc_census_gazetteer_fixture.py
      - run: python3 scripts/validate_nyc_osm_relation_metadata_fixture.py
      - run: python3 scripts/validate_nyc_geoboundaries_fixture.py
      - run: python3 scripts/validate_nyc_whos_on_first_fixture.py
      - run: python3 scripts/validate_nyc_overture_fixture.py
      - name: Validate NYC DCP source-page v2 artifact against the public JSON Schema
        run: |
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open("schemas/fixture-dependent-public-view/v2"))
          artifact = json.load(open("data/fixtures/nyc-dcp-borough-boundaries-public-view.json"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(artifact)
          PY
      - run: python3 scripts/generate_nyc_dcp_source_view.py --check
      - name: Validate NYC DCP source-page JSON-LD expansion
        run: |
          python3 - <<'PY'
          import json
          from pyld import jsonld
          document = json.load(open("nyc-dcp-borough-boundaries/index.jsonld"))
          expanded = jsonld.expand(document)
          if not isinstance(expanded, list) or not expanded:
              raise SystemExit("JSON-LD expansion produced no nodes")
          for node in expanded:
              identifier = node.get("@id")
              if identifier is not None and not identifier.startswith("https://"):
                  raise SystemExit(f"expanded graph contains a non-HTTPS node identity: {identifier}")
          print(f"JSON-LD expansion validates: {len(expanded)} nodes.")
          PY
      - name: Validate NYC Census Gazetteer source-page v2 artifact against the public JSON Schema
        run: |
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open("schemas/fixture-dependent-public-view/v2"))
          artifact = json.load(open("data/fixtures/nyc-census-gazetteer-source-public-view.json"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(artifact)
          PY
      - run: python3 scripts/generate_nyc_census_gazetteer_source_view.py --check
      - name: Validate NYC Census Gazetteer source-page JSON-LD expansion
        run: |
          python3 - <<'PY'
