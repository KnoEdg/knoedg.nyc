      - "nyc-openstreetmap/**"
      - "nyc-whos-on-first/**"
      - "nyc-geoboundaries/**"
      - "nyc-overture/**"
      - "assets/styles.css"
      - "assets/nyc-boroughs.svg"
      - "assets/nyc-boundaries-comparison.svg"
      - "data/fixtures/nyc-boroughs-water-excluded.json"
      - "data/fixtures/nyc-boroughs-water-included.json"
      - "data/sources/nyc-boroughs-water-included-2026-08-09.geojson"
      - "scripts/build_nyc_water_included_fixture.py"
      - "scripts/generate_nyc_boroughs_svg.py"
      - "scripts/validate_nyc_boundary_counts.py"
      - "scripts/generate_nyc_boundaries_view.py"
      - "scripts/generate_fixture_page.py"
