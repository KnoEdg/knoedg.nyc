name: TEMP Refresh boundary validator checksums

on:
  push:
    branches:
      - codex/nyc-boundaries-surface-split
    paths:
      - ".github/workflows/tmp-refresh-boundary-validator-checksums.yml"
      - "scripts/validate_nyc_boundary_counts.py"
      - "scripts/validate_nyc_census_gazetteer_fixture.py"
      - "scripts/validate_nyc_osm_relation_metadata_fixture.py"
      - "scripts/validate_nyc_geoboundaries_fixture.py"
      - "scripts/validate_nyc_whos_on_first_fixture.py"
      - "scripts/validate_nyc_overture_fixture.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nyc-boundaries-surface-split
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh changed boundary validator entries only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          ledger = Path('data/fixtures/SHA256SUMS')
          paths = [
              'scripts/validate_nyc_boundary_counts.py',
              'scripts/validate_nyc_census_gazetteer_fixture.py',
              'scripts/validate_nyc_osm_relation_metadata_fixture.py',
              'scripts/validate_nyc_geoboundaries_fixture.py',
              'scripts/validate_nyc_whos_on_first_fixture.py',
              'scripts/validate_nyc_overture_fixture.py',
          ]
          tracked = set(paths)
          kept = []
          for line in ledger.read_text().splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2 and parts[1] in tracked:
                  continue
              kept.append(line)
          for path in paths:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              kept.append(f'{digest}  {path}')
          ledger.write_text('\n'.join(kept) + '\n')
          PY
          sha256sum --check data/fixtures/SHA256SUMS
      - name: Commit checksum ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures/SHA256SUMS
          git commit -m "test: refresh boundary validator checksums"
          git push origin HEAD:codex/nyc-boundaries-surface-split
